name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  platform-doctor:
    name: Platform Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install Platform Doctor
        run: go install github.com/chaosslabs/platform-doctor/cmd/platform-doctor@e8db1a5be9a72fc6aa9fcb5f5e0ae047f49325e1

      - name: Scan repository
        run: platform-doctor scan . --output "$RUNNER_TEMP/platform-doctor-report.md"

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/platform-doctor-report.md" ]; then
            cat "$RUNNER_TEMP/platform-doctor-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Platform Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-doctor-report
          path: ${{ runner.temp }}/platform-doctor-report.md
          retention-days: 30

  dashboard:
    name: Dashboard Safety and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install development tools
        run: make install

      - name: Run all checks
        run: make ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          fail_ci_if_error: true
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: platformlabs-co/fetchr.sh

  alerting:
    name: Alert Rules and Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Download verified monitoring tools
        run: |
          mkdir -p "$RUNNER_TEMP/monitoring"
          cd "$RUNNER_TEMP/monitoring"
          for spec in prometheus:3.14.0 alertmanager:0.34.1; do
            tool="${spec%:*}"
            version="${spec#*:}"
            archive="$tool-$version.linux-amd64.tar.gz"
            curl -fsSL "https://github.com/prometheus/$tool/releases/download/v$version/$archive" -o "$archive"
            curl -fsSL "https://github.com/prometheus/$tool/releases/download/v$version/sha256sums.txt" -o "$tool.sums"
            sha256sum --check --ignore-missing "$tool.sums"
            tar -xzf "$archive"
          done
      - name: Validate rules and routing
        run: |
          "$RUNNER_TEMP/monitoring/prometheus-3.14.0.linux-amd64/promtool" check config examples/alerting/prometheus.yml
          "$RUNNER_TEMP/monitoring/prometheus-3.14.0.linux-amd64/promtool" test rules examples/alerting/rules.test.yml
          "$RUNNER_TEMP/monitoring/alertmanager-0.34.1.linux-amd64/amtool" check-config examples/alerting/alertmanager.yml
      - name: Validate real notification lifecycle
        run: |
          go test -race ./internal/alerting ./internal/proxy
          go build -o "$RUNNER_TEMP/netkit-alert-test" ./cmd/netkit
          python3 scripts/test-alerting-integration.py --netkit "$RUNNER_TEMP/netkit-alert-test" --alertmanager "$RUNNER_TEMP/monitoring/alertmanager-0.34.1.linux-amd64/alertmanager"
