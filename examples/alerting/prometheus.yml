global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    netkit_dashboard: http://localhost:3000
    netkit_incidents: http://localhost:8090
rule_files:
  - rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: netkit
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels:
          instance: netkit-local
          # Enable ONLY for an isolated, comparable ordinary HTTP workload.
          # Do not enable for a mixed streaming/long-polling proxy.
          netkit_latency_profile: unclassified
