{
  "rule_files": [
    "rules.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "sustained HTTP failure fires after hold and recovers",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"complete\",http_status_class=\"2xx\"}",
          "values": "0+80x30"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"complete\",http_status_class=\"5xx\"}",
          "values": "0+20x8 160+0x21"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "2m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\",instance=\"netkit-local\",job=\"netkit\",severity=\"warning\"}",
              "value": 1
            }
          ]
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "15m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "short failure spike stays quiet",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"complete\",http_status_class=\"2xx\"}",
          "values": "0+80x20"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"complete\",http_status_class=\"5xx\"}",
          "values": "0 20+0x19"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "3m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "8m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "low sample counts do not page",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"complete\",http_status_class=\"5xx\"}",
          "values": "0+1x20"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "10m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"NetkitInsufficientSamples\",alertstate=\"firing\"}",
          "eval_time": "10m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"NetkitInsufficientSamples\",alertstate=\"firing\",instance=\"netkit-local\",job=\"netkit\",severity=\"info\"}",
              "value": 1
            }
          ]
        }
      ]
    },
    {
      "name": "fresh reachable proxy has no data, not healthy",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitInsufficientSamples\",alertstate=\"firing\"}",
          "eval_time": "6m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"NetkitInsufficientSamples\",alertstate=\"firing\",instance=\"netkit-local\",job=\"netkit\",severity=\"info\"}",
              "value": 1
            }
          ]
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "6m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "external downtime and recovery",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1 0+0x5 1+0x10"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitUnavailable\",alertstate=\"firing\"}",
          "eval_time": "2m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUnavailable\",alertstate=\"firing\"}",
          "eval_time": "3m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"NetkitUnavailable\",alertstate=\"firing\",instance=\"netkit-local\",job=\"netkit\",severity=\"critical\"}",
              "value": 1
            }
          ]
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUnavailable\",alertstate=\"firing\"}",
          "eval_time": "7m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "transport errors fire independently",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"complete\",http_status_class=\"2xx\"}",
          "values": "0+80x20"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"upstream_error\",http_status_class=\"none\"}",
          "values": "0+20x20"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitTransportFailureRate\",alertstate=\"firing\"}",
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"NetkitTransportFailureRate\",alertstate=\"firing\",instance=\"netkit-local\",job=\"netkit\",severity=\"warning\"}",
              "value": 1
            }
          ]
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "5m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "latency profile ordinary",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        },
        {
          "series": "netkit_response_headers_seconds_bucket{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"ordinary\",method=\"GET\",le=\"1\"}",
          "values": "0+0x20"
        },
        {
          "series": "netkit_response_headers_seconds_bucket{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"ordinary\",method=\"GET\",le=\"2.5\"}",
          "values": "0+100x20"
        },
        {
          "series": "netkit_response_headers_seconds_bucket{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"ordinary\",method=\"GET\",le=\"+Inf\"}",
          "values": "0+100x20"
        },
        {
          "series": "netkit_response_headers_seconds_count{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"ordinary\",method=\"GET\"}",
          "values": "0+100x20"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitHeaderLatencyHigh\",alertstate=\"firing\"}",
          "eval_time": "3m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"NetkitHeaderLatencyHigh\",alertstate=\"firing\"}",
          "eval_time": "7m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"NetkitHeaderLatencyHigh\",alertstate=\"firing\",instance=\"netkit-local\",job=\"netkit\",severity=\"warning\"}",
              "value": 1
            }
          ]
        }
      ]
    },
    {
      "name": "latency profile unclassified",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        },
        {
          "series": "netkit_response_headers_seconds_bucket{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"unclassified\",method=\"GET\",le=\"1\"}",
          "values": "0+0x20"
        },
        {
          "series": "netkit_response_headers_seconds_bucket{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"unclassified\",method=\"GET\",le=\"2.5\"}",
          "values": "0+100x20"
        },
        {
          "series": "netkit_response_headers_seconds_bucket{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"unclassified\",method=\"GET\",le=\"+Inf\"}",
          "values": "0+100x20"
        },
        {
          "series": "netkit_response_headers_seconds_count{job=\"netkit\",instance=\"netkit-local\",netkit_latency_profile=\"unclassified\",method=\"GET\"}",
          "values": "0+100x20"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitHeaderLatencyHigh\",alertstate=\"firing\"}",
          "eval_time": "3m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"NetkitHeaderLatencyHigh\",alertstate=\"firing\"}",
          "eval_time": "7m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "cancellations and inspection rejection do not become transport failures",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"netkit\",instance=\"netkit-local\"}",
          "values": "1+0x40"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"client_canceled\",http_status_class=\"none\"}",
          "values": "0+100x20"
        },
        {
          "series": "netkit_exchanges_total{job=\"netkit\",instance=\"netkit-local\",method=\"GET\",outcome=\"blocked_by_inspection\",http_status_class=\"none\"}",
          "values": "0+100x20"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"NetkitTransportFailureRate\",alertstate=\"firing\"}",
          "eval_time": "10m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"NetkitUpstreamFailureRate\",alertstate=\"firing\"}",
          "eval_time": "10m",
          "exp_samples": []
        }
      ]
    }
  ]
}
